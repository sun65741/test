<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 100px;
            margin: 0;
            color: #ff6b6b;
            line-height: 1;
        }
        h2 {
            font-size: 24px;
            margin: 10px 0 20px;
            font-weight: 500;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background-color: #4facfe;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #00f2fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>页面走丢了</h2>
        <p>抱歉，您访问的资源不存在或已被删除。</p>
        <a href="/" class="btn">返回首页</a>
    </div>
</body>
</html>
